                  email: "someone@example.com"
                  subscription_status: "complained"
                  subscribed_at: "2026-09-21T10:15:00Z"
                  unsubscribed_at: "2026-10-21T10:15:00Z"
                  created_at: "2026-09-21T10:15:00Z"
                  updated_at: "2026-10-21T10:15:00Z"
                previous_subscription_status: "unsubscribed"
                complaint:
                  feedback_type: "abuse"
                  reporter: "yahoo"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  # Route Event Webhooks (Inbound Email Processing)
  message.routing:
    post:
      summary: Inbound Message Route Event
      description: |
        &nbsp;

        Triggered when an inbound email is received and processed through a configured route.

        **Purpose**: This webhook delivers complete inbound email data to your application for processing inbound emails (like support tickets, replies, etc.).

        **Difference from message events**:
        - **Route events**: Process *inbound* emails sent TO your domains
        - **Message events**: Track *outbound* emails sent FROM your domains

        **Route configuration**:
        - Configure routes in your AhaSend dashboard
        - Choose whether to include attachments and headers
        - Set recipient filters and processing options

        When attachments are enabled, `attachments` includes conventional attachments,
        inline MIME parts (such as images referenced by `cid:` URLs in `html_body`), and
        filename-bearing MIME parts that omit the `Content-Disposition` header.

        **Use cases**:
        - Support ticket systems
        - Email-to-ticket conversion
        - Automated email processing
        - Reply handling

        **When it's sent**: When an inbound email matches a configured route.
      tags:
        - Route Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteWebhookPayload'
            example:
              type: "message.routing"
              route_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T13:15:46.404433272Z"
              data:
                id: "route-msg-12345"
                from: "customer@gmail.com"
                reply_to: "customer@gmail.com"
                to: "support@yourdomain.com"
                subject: "Help with my account"
                message_id: "<unique-message-id@gmail.com>"
                size: 2048
                spam_score: 0.1
                bounce: false
                cc: ""
                date: "Mon, 06 May 2024 13:15:46 +0000"
                in_reply_to: ""
                references: ""
                auto_submitted: ""
                html_body: "<p>I need help with my account settings.</p>"
                plain_body: "I need help with my account settings."
                reply_from_plain_body: "I need help with my account settings."
                attachments:
                  - filename: "logo.png"
                    content_type: "image/png"
                    content_id: "logo-123"
                    disposition: "inline"
                    data: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB..."
                headers:
                  "X-Mailer": "Gmail"
                  "X-Priority": "3"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

components:
  schemas:
    # Webhook payload schemas
    MessageWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum:
            - message.reception
            - message.delivered
            - message.transient_error
            - message.failed
            - message.bounced
            - message.suppressed
            - message.opened
            - message.clicked
            - message.unsubscribed
            - message.complained
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO 8601 format)
        data:
          $ref: '#/components/schemas/MessageWebhookData'

    MessageReceptionWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.reception
    MessageDeliveredWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.delivered
    MessageTransientErrorWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.transient_error
    MessageFailedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.failed
    MessageBouncedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.bounced
    MessageSuppressedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.suppressed
    MessageOpenedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.opened
    MessageUnsubscribedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.unsubscribed
    MessageComplainedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - message.complained
    MessageClickedWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum:
            - message.clicked
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO 8601 format)
        data:
          $ref: '#/components/schemas/MessageClickedWebhookData'

    MessageWebhookData:
      type: object
      required:
        - account_id
        - event
        - from
        - recipient
        - subject
        - message_id_header
        - id
      properties:
        account_id:
          type: string
          format: uuid
          description: Account ID that sent the message
        event:
          type: string
          enum:
            - on_reception
            - on_delivered
            - on_transient_error
            - on_failed
            - on_bounced
            - on_suppressed
            - on_opened
            - on_clicked
            - on_unsubscribed
            - on_complained
          description: The specific event that occurred
        from:
          type: string
          description: |
            Sender address. For a campaign message it includes the sender's
            name, as `Name <address>`.
        recipient:
          type: string
          format: email
          description: Recipient email address
        subject:
          type: string
          description: Email subject line
        message_id_header:
          type: string
          description: Message ID header (same as returned by [Create Message](https://ahasend.com/docs/api-reference/messages/create-message) or [Create Template Message](https://ahasend.com/docs/api-reference/messages/create-template-message))
        id:
          type: string
          description: Internal AhaSend message ID
        user_agent:
          type: string
          description: User agent (only for opened/clicked events)
        ip:
          type: string
          description: IP address (only for opened/clicked events)
        is_bot:
          type: boolean
          description: |
            Whether the action was performed by a bot.

            Bot detection runs on every open and click and always yields a definite
            true or false. Current deliveries include the field on every message
            event; it is meaningful for `message.opened` and always `false`
            elsewhere. Older deliveries may omit it — absence carries no signal, so
            do not infer `false` from a missing field and never reject a delivery
            because of it.
        delivery_attempt:
          description: |
            Diagnostics for the delivery attempt this event reports on: the
            SMTP status code, the response text, and — on failures — the
            bucket the bounce classifier assigned.

            Optional, and absent more often than present. Today it is
            `message.delivered`, `message.bounced`, and
            `message.transient_error` that carry it, and only when an SMTP
            attempt was actually recorded. These are the cases where no attempt
            is recorded, and so no object is sent:

            - **Retry exhaustion.** A message that runs out of retries arrives
              as `message.failed`, which reports the exhaustion rather than a
              single attempt.
            - **Out-of-band bounces**, where the DSN arrives separately after
              the destination already accepted the message.
            - **Non-SMTP routing**, where the message was handled outside SMTP.
              Sandbox sends are the exception: they synthesize a representative
              attempt rather than omitting one.
            - **Empty responses**, carrying neither a status code nor any text.

            These cases are not closed, and an explicit `null` means the same
            as a missing field. Always read the object with optional chaining
            and never treat its absence as an error. Equally, do not treat its
            presence on another event sharing this data shape as impossible.
            Events with their own data shape — `message.clicked`,
            `message.routing`, `suppression.created`, `suppression.deleted`,
            `domain.dns_error`, and the `contact.*` events — never carry one.

            On test webhooks and sandbox deliveries the values are
            representative rather than observed. A sandbox simulation can
            replace the sample classification with the classification of the
            selected outcome, so it may not agree with the representative SMTP
            code and response. Do not calibrate a `classification` switch
            against sandbox traffic.
          $ref: '#/components/schemas/DeliveryAttempt'
        unsubscribe:
          description: How the recipient unsubscribed. Present only on `message.unsubscribed`.
          $ref: '#/components/schemas/WebhookUnsubscribe'
        complaint:
          description: The spam complaint report. Present only on `message.complained`.
          $ref: '#/components/schemas/WebhookComplaint'
        campaign_id:
          type: string
          format: uuid
          description: The campaign that sent the message. Present only on the events of a campaign message.
        list_id:
          type: [string, 'null']
          format: uuid
          description: |
            The list through which the campaign reached the recipient, or
            `null` when the campaign did not reach the recipient through a
            list. Present only on the events of a campaign message.
        segment_id:
          type: [string, 'null']
          format: uuid
          description: |
            The segment through which the campaign reached the recipient, or
            `null` when the campaign did not reach the recipient through a
            segment. Present only on the events of a campaign message.

    MessageClickedWebhookData:
      type: object
      required:
        - account_id
        - event
        - from
        - recipient
        - subject
        - message_id_header
        - url
        - user_agent
        - ip
        - id
      properties:
        account_id:
          type: string
          format: uuid
          description: Account ID that sent the message
        event:
          type: string
          description: The specific event that occurred
        from:
          type: string
          description: |
            Sender address. For a campaign message it includes the sender's
            name, as `Name <address>`.
        recipient:
          type: string
          format: email
          description: Recipient email address
        subject:
          type: string
          description: Email subject line
        message_id_header:
          type: string
          description: Message ID header (same as returned by [Create Message](https://ahasend.com/docs/api-reference/messages/create-message) or [Create Template Message](https://ahasend.com/docs/api-reference/messages/create-template-message))
        url:
          type: string
          description: The URL that was clicked
        user_agent:
          type: string
          description: User agent of the client that clicked the link
        ip:
          type: string
          description: IP address of the client that clicked the link
        id:
          type: string
          description: Internal AhaSend message ID
        is_bot:
          type: boolean
          description: |
            Whether the click was performed by a bot.

            Bot detection runs on every click, so the field is always present with a
            definite true or false. It stays optional in this schema for tolerance:
            if it were ever absent, do not infer `false` and do not reject the
            delivery.
        campaign_id:
          type: string
          format: uuid
          description: The campaign that sent the message. Present only on the events of a campaign message.
        list_id:
          type: [string, 'null']
          format: uuid
          description: |
            The list through which the campaign reached the recipient, or
            `null` when the campaign did not reach the recipient through a
            list. Present only on the events of a campaign message.
        segment_id:
          type: [string, 'null']
          format: uuid
          description: |
            The segment through which the campaign reached the recipient, or
            `null` when the campaign did not reach the recipient through a
            segment. Present only on the events of a campaign message.

    DeliveryAttempt:
      # `null` is admitted alongside the object deliberately: it carries exactly
      # the same meaning as the field being absent, so a consumer that rejected
      # it would answer 400 to a delivery that told it nothing was recorded, and
      # 100 consecutive failures disable a webhook. Absent, `null`, and an
      # object are the three states a reader must handle.
      type: ["object", "null"]
      description: |
        Diagnostics from a single delivery attempt: the SMTP status code, the
        response text, and — on failures — the bucket the bounce classifier
        assigned.
      required:
        - smtp_code
      properties:
        classification:
          type: string
          description: |
            Bucket the bounce classifier assigned to this attempt. Absent on
            successful deliveries, and absent on a failure the classifier did
            not label.

            Known values: `InvalidRecipient`, `BadDomain`, `InactiveMailbox`, `InvalidSender`, `QuotaIssues`, `NoAnswerFromHost`, `BadConnection`, `DNSFailure`, `RoutingErrors`, `TransientFailure`, `MessageExpired`, `ProtocolErrors`, `AuthenticationFailed`, `PolicyRelated`, `Uncategorized`.

            This is **not** a closed set. New buckets can be introduced at any
            time, and this list describes what is emitted today rather than
            everything that may ever appear. Branch on the values you know and
            keep a fallback branch for everything else; never reject a delivery
            because the value is unfamiliar.

            Note that `TransientFailure` here is a classification, unrelated to
            the `message.transient_error` event type or to the `event` field.
          x-known-values:
            - InvalidRecipient
            - BadDomain
            - InactiveMailbox
            - InvalidSender
            - QuotaIssues
            - NoAnswerFromHost
            - BadConnection
            - DNSFailure
            - RoutingErrors
            - TransientFailure
            - MessageExpired
            - ProtocolErrors
            - AuthenticationFailed
            - PolicyRelated
            - Uncategorized
        smtp_code:
          type: integer
          minimum: 0
          description: |
            SMTP status code recorded for the attempt. Usually this is the code
            returned by the destination. Always present when this object is
            present. `0` means AhaSend recorded response content without an SMTP
            code — an internal error, typically — so do not read `0` as the
            field being absent.
        enhanced_status_code:
          type: string
          description: |
            RFC 3463 enhanced status code in `class.subject.detail` form (for
            example `5.1.1`), when one was recorded for the attempt.
        response:
          type: string
          description: |
            Text describing the outcome, as the MTA recorded it. Present when
            non-empty.

            Two things it is not. It is not reliably code-free: the reply code
            usually lives in `smtp_code` alone, but some destinations leave the
            reply code, the enhanced code, or both at the front of the text, so
            do not assume a bare sentence and do not parse codes back out of
            it. And it is not always the destination's own words: when the
            failure was raised inside AhaSend rather than by the destination,
            this carries AhaSend's description of that failure instead.

            Read it as human-readable diagnostics. Branch on `classification`,
            `smtp_code`, and `enhanced_status_code`.
        description:
          type: string
          description: |
            Human-readable translation of a complex `response`, present only
            when that translation differs from `response` itself.

            This is display prose, not an identifier: its wording changes as
            the translations improve. Never compare it to a literal and never
            parse it — branch on `classification`, `smtp_code`, or
            `enhanced_status_code` instead.
        command:
          type: string
          description: |
            Normalized SMTP command name that was in flight when the attempt was
            recorded (for example `RCPT TO` or `DATA`), when the MTA reported
            one. Command arguments such as envelope addresses are not included.

    SuppressionWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum: [suppression.created, suppression.deleted]
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the suppression was created, changed or deleted (ISO 8601 format)
        data:
          $ref: '#/components/schemas/SuppressionWebhookData'

    SuppressionWebhookData:
      type: object
      description: The suppression as it was right after the change, or right before the delete for `suppression.deleted`.
      required:
        - account_id
        - origin
        - recipient
        - created_at
        - expires_at
        - reason
        - sending_domain
      properties:
        account_id:
          type: string
          format: uuid
          description: Account ID
        origin:
          $ref: '#/components/schemas/WebhookOrigin'
        recipient:
          type: string
          format: email
          description: Suppressed email address
        created_at:
          type: string
          format: date-time
          description: When the suppression was created
        expires_at:
          type: string
          format: date-time
          description: When the suppression expires. Delivery errors suppress the address for up to 30 days, and an unsubscribe or a spam complaint for 10 years. A suppression made through the API expires when its request says.
        reason:
          type: string
          description: Reason for suppression (e.g., "Too many hard bounces")
        sending_domain:
          type: string
          description: The sending domain that the suppression applies to

    DomainWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum: [domain.dns_error]
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO 8601 format)
        data:
          $ref: '#/components/schemas/DomainWebhookData'

    DomainWebhookData:
      type: object
      required:
        - domain
        - account_id
        - spf_valid
        - dkim_valid
        - dmarc_valid
        - dns_last_checked_at
      properties:
        domain:
          type: string
          description: Domain name with DNS issues
        account_id:
          type: string
          format: uuid
          description: Account ID
        spf_valid:
          type: boolean
          description: Whether SPF record is valid
        dkim_valid:
          type: boolean
          description: Whether DKIM record is valid
        dmarc_valid:
          type: boolean
          description: Whether DMARC record is valid
        dns_last_checked_at:
          type: string
          format: date-time
          description: When DNS was last checked

    WebhookUnsubscribe:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum: [one_click, link]
          description: |
            `one_click` for a one-click unsubscribe from the recipient's email
            client (a POST with the body `List-Unsubscribe=One-Click`, RFC
            8058), and `link` for any other unsubscribe.

    WebhookComplaint:
      type: object
      required:
        - feedback_type
        - reporter
      properties:
        feedback_type:
          type: string
          description: |
            The feedback type of the report (the ARF `Feedback-Type`), in lower
            case: `abuse` or `fraud`.
        reporter:
          type: string
          description: |
            The feedback loop that sent the report. Known values: `yahoo`,
            `microsoft`, and `comcast`.

            This is **not** a closed set: AhaSend can add feedback loops at any
            time. Keep a fallback branch for an unfamiliar value, and never
            reject a delivery because of it.
          x-known-values:
            - yahoo
            - microsoft
            - comcast

    WebhookOrigin:
      type: string
      enum: [recipient, api, dashboard, system]
      description: |
        Who made the change: `recipient` for the contact or recipient, through
        an unsubscribe link, a one-click unsubscribe, or a spam complaint;
        `api` for you, through the AhaSend API; `dashboard` for you, through
        the AhaSend dashboard; `system` for AhaSend, for example after a
        bounce, an expired message or an email validation, or when AhaSend
        support makes the change.

    ContactWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum: [contact.created, contact.deleted]
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the change happened (ISO 8601 format)
        data:
          $ref: '#/components/schemas/ContactWebhookData'

    ContactCreatedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.created
    ContactDeletedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.deleted

    ContactUpdatedWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum: [contact.updated]
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the change happened (ISO 8601 format)
        data:
          $ref: '#/components/schemas/ContactUpdatedWebhookData'

    ContactListWebhookPayload:
      type: object
      required:
        - type
        - webhook_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum:
            - contact.added_to_list
            - contact.removed_from_list
            - contact.subscribed
            - contact.unsubscribed
            - contact.complained
          description: The event type
        webhook_id:
          type: string
          description: The webhook ID (the same ID as returned by the [Create Webhook API](https://ahasend.com/docs/api-reference/webhooks/create-webhook))
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: When the change happened (ISO 8601 format)
        data:
          $ref: '#/components/schemas/ContactListWebhookData'

    ContactAddedToListWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactListWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.added_to_list
    ContactRemovedFromListWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactListWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.removed_from_list
    ContactSubscribedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactListWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.subscribed
    ContactUnsubscribedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactListWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.unsubscribed
    ContactComplainedWebhookPayload:
      allOf:
        - $ref: '#/components/schemas/ContactListWebhookPayload'
        - type: object
          properties:
            type:
              enum:
                - contact.complained

    ContactWebhookData:
      type: object
      required:
        - account_id
        - origin
        - contact
      properties:
        account_id:
          type: string
          format: uuid
          description: Account ID
        origin:
          $ref: '#/components/schemas/WebhookOrigin'
        campaign_id:
          type: string
          format: uuid
          description: |
            The campaign whose email caused the change, when a recipient
            unsubscribed from a campaign email or reported it as spam.
            Absent otherwise.
        segment_id:
          type: string
          format: uuid
          description: |
            The segment through which that campaign reached the recipient,
            when the campaign was sent to a segment. Absent otherwise.
        contact:
          description: |
            The contact as it was right after the change, in the shape that the
            Contacts API returns. For `contact.deleted`, the contact as it was
            right before the delete.
          $ref: '#/components/schemas/Contact'

    ContactUpdatedWebhookData:
      allOf:
        - $ref: '#/components/schemas/ContactWebhookData'
        - type: object
          required:
            - changed_fields
          properties:
            changed_fields:
              type: array
              items:
                type: string
              description: |
                The `contact` fields whose values changed. A change to any key
                of `attributes` lists `attributes`. It never lists
                `unsubscribed` or `unsubscribed_at`: the unsubscribe from all
                lists sends `contact.unsubscribed` and `contact.subscribed`.

                Known values: `email`, `first_name`, `last_name`, `status`,
                `status_reason`, and `attributes`. This is **not** a closed
                set: a new contact field can appear here.
              x-known-values:
                - email
                - first_name
                - last_name
                - status
                - status_reason
                - attributes

    ContactListWebhookData:
      allOf:
        - $ref: '#/components/schemas/ContactWebhookData'
        - type: object
          required:
            - list
            - list_contact
          properties:
            list:
              oneOf:
                - $ref: '#/components/schemas/WebhookList'
                - type: 'null'
              description: |
                The list of the membership. `null` when the event is about the
                contact's unsubscribe from all lists: `contact.unsubscribed`
                when it is set, `contact.subscribed` when it is cleared, and
                `contact.complained` for a complaint about a campaign sent to a
                segment.
            list_contact:
              oneOf:
                - $ref: '#/components/schemas/WebhookListContact'
                - type: 'null'
              description: |
                The membership (list contact) as it was right after the change,
                in the shape that the Lists API returns, without the embedded
                `contact` and `list`. For `contact.removed_from_list`, the
                membership as it was right before the removal. `null` when
                `list` is `null`.
            previous_subscription_status:
              type: string
              enum: [unconfirmed, confirmed, unsubscribed, complained]
              description: |
                The membership's subscription status before the change. Present
                only on `contact.subscribed`, `contact.unsubscribed`, and
                `contact.complained`, when `list` is not `null`.
            complaint:
              description: The spam complaint report. Present only on `contact.complained`.
              $ref: '#/components/schemas/WebhookComplaint'

    WebhookList:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The list ID
        name:
          type: string
          description: The list name

    # Contact schemas, copied from the AhaSend API specification (openapi.yaml),
    # but open: a later delivery can carry a field that this version does not
    # list, so a receiver must not reject one.
    JSONValue:
      description: Any recursively nested JSON value stored in a contact attribute
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/JSONValue'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'

    Contact:
      type: object
      description: |
        Public contact projection. Attribute reads are legacy-safe: values can
        contain null, booleans, numbers, strings, arrays, or nested objects even
        though new writes accept only canonical dashboard-defined values.
      required:
        - object
        - id
        - created_at
        - updated_at
        - email
        - first_name
        - last_name
        - status
        - status_reason
        - unsubscribed
        - unsubscribed_at
        - attributes
        - validation_status
        - last_validated_at
      properties:
        object:
          type: string
          enum: [contact]
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the contact
        created_at:
          type: string
          format: date-time
          description: When the contact was created
        updated_at:
          type: string
          format: date-time
          description: When the contact was last updated
        email:
          type: string
          format: email
          description: Normalized contact email address
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
          enum: [enabled, disabled, blocked]
        status_reason:
          type: string
        unsubscribed:
          type: boolean
        unsubscribed_at:
          type: [string, 'null']
          format: date-time
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
        validation_status:
          type: string
          enum: [unvalidated, valid, invalid, risky, unknown]
        last_validated_at:
          type: [string, 'null']
          format: date-time

    # The API's ListContact without its `contact` and `list` properties.
    WebhookListContact:
      type: object
      description: |
        One contact's membership of one list. It carries no id of its own: a
        membership is addressed by the `(list_id, contact_id)` pair.
      required:
        - object
        - list_id
        - contact_id
        - email
        - subscription_status
        - subscribed_at
        - unsubscribed_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          enum: [list_contact]
          description: Object type identifier
        list_id:
          type: string
          format: uuid
          description: The list this membership is on
        contact_id:
          type: string
          format: uuid
          description: The contact this membership belongs to
        email:
          type: string
          format: email
          description: The contact's normalized email address
        subscription_status:
          type: string
          enum: [unconfirmed, confirmed, unsubscribed, complained]
          description: |
            Per-list consent, independent of the contact's account-wide
            `unsubscribed` flag. `complained` is the mailbox provider's verdict
            and is never writable.
        subscribed_at:
          type: [string, 'null']
          format: date-time
          description: |
            When consent was given. Set when the membership becomes
            `confirmed` and left alone afterwards, so it records when consent
            was given rather than when it was last re-asserted.
        unsubscribed_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the membership became `unsubscribed`, or when the complaint
            landed for a `complained` membership. Cleared when the membership
            becomes `confirmed` again.
        created_at:
          type: string
          format: date-time
          description: When the membership was created
        updated_at:
          type: string
          format: date-time
          description: When the membership was last updated

    RouteWebhookPayload:
      type: object
      required:
        - type
        - route_id
        - timestamp
        - data
      properties:
        type:
          type: string
          enum: [message.routing]
          description: The event type
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO 8601 format)
        route_id:
          type: string
          description: The route ID (the same ID as returned by the [Create Route API](https://ahasend.com/docs/api-reference/routes/create-route))
          format: uuid
        data:
          $ref: '#/components/schemas/RouteWebhookData'

    RouteWebhookData:
      type: object
      # Mirrors the producer's struct tags: every field except `headers`
      # carries no `omitempty`, so Go emits it on every delivery.
      required:
        - id
        - from
        - reply_to
        - to
        - subject
        - message_id
        - size
        - spam_score
        - bounce
        - cc
        - date
        - in_reply_to
        - references
        - auto_submitted
        - html_body
        - plain_body
        - reply_from_plain_body
        - attachments
      properties:
        id:
          type: string
          description: Unique route message ID
        from:
          type: string
          description: Sender mailbox text
        reply_to:
          type: string
          description: |
            The message's Reply-To header as received, which may include a
            display name or several addresses. Empty when the message has none.
        to:
          type: string
          description: |
            The recipient address the route matched. On a route that groups
            by Message-ID, the message's To header as received instead, which
            may include display names and several addresses.
        subject:
          type: string
          description: Email subject line
        message_id:
          type: string
          description: Original Message-ID header
        size:
          type: integer
          description: Email size in bytes
        spam_score:
          type: number
          format: double
          description: |
            The spam filter's score for the message. Higher means more likely
            spam; it can be below 0 or above 10. It is 0 when the message was
            not checked.
        bounce:
          type: boolean
          description: Whether this is a bounce message
        cc:
          type: string
          description: CC recipients
        date:
          type: string
          description: Date header from the email
        in_reply_to:
          type: string
          description: In-Reply-To header
        references:
          type: string
          description: References header
        auto_submitted:
          type: string
          description: Auto-Submitted header
        html_body:
          type: string
          description: HTML body content
        plain_body:
          type: string
          description: Plain text body content
        reply_from_plain_body:
          type: string
          description: Extracted reply content from plain body
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RouteAttachment'
          description: |
            MIME attachments, if the route is configured to include them. This includes
            conventional attachments, inline parts, and filename-bearing parts without a
            Content-Disposition header. Use `content_id` to resolve `cid:` references in
            `html_body`.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Email headers (if route is configured to include them)

    RouteAttachment:
      type: object
      required:
        - filename
        - content_type
        - content_id
        - disposition
        - data
      properties:
        filename:
          type: string
          description: Attachment filename
        content_type:
          type: string
          description: MIME content type
        content_id:
          type: string
          description: |
            Content-ID with the angle brackets stripped and the remainder
            percent-decoded, so `<a+b%40x>` arrives as `a b@x`. Empty when the part had
            no Content-ID header — the key is always present.

            This is what distinguishes an embedded part from a real attachment, not
            `disposition`: an image referenced by a `cid:` URL commonly arrives with no
            Content-Disposition header at all.
        disposition:
          type: string
          description: |
            Content-Disposition type of the MIME part, usually `attachment` or `inline`,
            and `""` when the part carried no Content-Disposition header.

            Note that `""` does not mean "not inline". An embedded image sent as a
            `multipart/related` part with a Content-ID and no Content-Disposition — what
            Gmail and Outlook produce — arrives with `disposition: ""` and a populated
            `content_id`. Use `content_id` to separate embedded parts from real
            attachments.

            The key is always present, and the value is deliberately unconstrained: it
            is whatever token the sending mail server wrote, merely lowercased and
            trimmed of parameters, so tokens other than `attachment` and `inline` (for
            example `form-data`) do arrive in practice.

            Do not validate this field against a fixed list of values — an arbitrary
            sender could then make your receiver fail, and repeated delivery failures
            can disable the webhook. Treat an unrecognized value as `attachment`.
        data:
          type: string
          description: Base64-encoded attachment data

tags:
  - name: Message Events
    description: |
      Webhooks for outbound email delivery tracking.

      These events track the lifecycle of emails you send through AhaSend, from initial reception through final delivery or failure.
  - name: Suppression Events
    description: |
      Webhooks for email suppression list changes.

      These events notify you when a suppression is created, gets a new reason, or is deleted: after delivery issues, when a recipient unsubscribes or reports spam, and when you or AhaSend support change your suppression list. Each event carries its `origin`.
  - name: Domain Events
    description: |
      Webhooks for domain configuration issues.

      These events alert you to DNS configuration problems that could prevent email delivery.
  - name: Contact Events
    description: |
      Webhooks for changes to your contacts and their list memberships.

      These events notify you when contacts are created, changed, or deleted, when they join or leave lists, and when they subscribe, unsubscribe, or report a campaign email as spam. They are available to accounts with the marketing features.
  - name: Route Events
    description: |
      Webhooks for inbound email processing.

      These events deliver inbound emails to your application for processing (e.g., support tickets, replies).
