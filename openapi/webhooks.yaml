openapi: 3.1.0
info:
  title: AhaSend Webhooks
  description: |
    AhaSend webhook events documentation. This specification describes all webhook events that AhaSend sends to your configured webhook URLs.

    ## Overview

    Webhooks are HTTP callbacks that AhaSend sends to your configured URLs when specific events occur. They provide real-time notifications about:

    - **Message Events**: Email delivery status (sent, delivered, bounced, opened, unsubscribed, reported as spam, etc.)
    - **Suppression Events**: When a suppression is created or deleted, by a recipient, by AhaSend, or by you
    - **Domain Events**: DNS configuration issues
    - **Contact Events**: Changes to your contacts and their list memberships, such as a new contact, an unsubscribe, or a spam complaint
    - **Route Events**: Inbound email processing

    ## Standard Webhooks Compatibility

    AhaSend webhook deliveries use the Standard Webhooks header names, signed-content format, HMAC-SHA256 algorithm, and signature format. Secret handling is intentionally different from the encoded-secret convention assumed by some Standard Webhooks libraries, so compatibility with stock libraries is not unconditional.

    ### Security Headers

    All webhooks include these security headers for verification:

    - `webhook-id`: Unique identifier for the webhook event (used as idempotency key)
    - `webhook-timestamp`: Unix timestamp when the webhook was sent
    - `webhook-signature`: HMAC-SHA256 signature of the payload using the resource secret, written as `v1,` followed by the signature in standard Base64

    ### Verification

    The HMAC key is the literal UTF-8 bytes of the `secret` returned when the webhook or route resource is created. Use the complete returned string, including any prefix. Do not Base64-decode it and do not strip a prefix.

    Use the AhaSend SDK verifier, or a verifier that explicitly accepts raw key bytes. A stock Standard Webhooks library is compatible only if it has a raw-secret/raw-key mode that preserves these literal UTF-8 bytes. Constructors that decode an encoded Standard Webhooks secret will derive a different key and reject valid AhaSend deliveries.

    The signed content is the unmodified `webhook-id`, `webhook-timestamp`, and raw request body joined with periods. See the [Standard Webhooks verification algorithm](https://github.com/standard-webhooks/standard-webhooks/blob/main/spec/standard-webhooks.md#verifying-webhook-authenticity) for the shared protocol details, subject to the AhaSend secret-handling boundary above.

    ### Retry Policy

    - Each webhook delivery is tried up to **6 times** in all (the first try and 5 retries), over about **16 minutes**
    - Each route delivery is tried up to **12 times** in all, over about **11 hours**
    - Only HTTP status codes **200-299** are considered successful
    - When more than **100 attempts in a row** fail, retries included, the webhook or route is automatically disabled
    - You'll receive an email notification when a webhook or route is disabled

    ### Payload Format

    All webhooks follow the Standard Webhooks payload structure:

    ```json
    {
      "type": "event.type",
      "webhook_id": "abe11757-2886-4b55-96f1-0e0afc95795a",
      "timestamp": "2024-05-06T09:49:16.687031577Z",
      "data": {
        // Event-specific data
      }
    }
    ```

    Message, suppression, domain, and contact webhooks use `webhook_id`. Route
    webhooks use `route_id` instead.

    ### Event Order

    Events are not delivered in the order in which they happened. Many workers
    send them, and each delivery is retried on its own, so a later event can
    arrive first. Order the events by their `timestamp`. For a contact or a
    suppression event it is the time of the change; for `message.unsubscribed`
    and `message.complained`, the time of the unsubscribe request or of the
    spam complaint report.

    ### Message Events

    Transactional and campaign messages send the same message events with the
    same payload. The events of a campaign message also carry `campaign_id`,
    `list_id`, and `segment_id`.

    AhaSend reads the message when it sends a message event. When the message
    is deleted before then, or for a campaign message its campaign recipient or
    its contact, the event is not sent. An event of a campaign message is also
    not sent when it happens before AhaSend has logged that it received the
    message.

    ### Contact Events

    Contact events are available to accounts with the marketing features. They
    report changes to your contacts and to their list memberships (list
    contacts). Every contact event carries the `contact` and its `origin`. The
    events that can be about a list membership (`contact.added_to_list`,
    `contact.removed_from_list`, `contact.subscribed`,
    `contact.unsubscribed`, and `contact.complained`) also carry the `list`
    and the `list_contact`.

    A webhook scoped to some of your domains gets a contact event only when
    an email from one of those domains caused it: an unsubscribe, a
    complaint, or a bounce that disables the contact. A change made through
    the API or the dashboard, or by email validation, has no domain and goes
    only to global webhooks.

    A contact event is sent only for a real change. A write that leaves the
    contact and its memberships as they were sends nothing. One write sends one
    event for each kind of change that it makes: one for each membership that
    it adds, removes, or changes the status of, one `contact.updated` for the
    contact's fields, and one for the contact's unsubscribe from all lists.
    There is one exception: a spam complaint about a campaign sent to a
    segment sends `contact.complained` when AhaSend records the complaint for
    the campaign's recipient, whatever the contact's state.

    **Unsubscribe from all lists**: The contact's `unsubscribed` field
    unsubscribes the contact from all lists. When it changes from `false` to
    `true`, AhaSend sends `contact.unsubscribed`, or `contact.complained` when
    a spam complaint about a campaign sent to a segment changes it. When it
    changes from `true` to `false`, AhaSend sends `contact.subscribed`. These
    events are not about one list, so their `list` and `list_contact` are
    `null`. A contact that is created with `unsubscribed: true` sends only
    `contact.created`.

    **Campaigns sent to a segment**: A segment is not a list, so a recipient
    of a campaign sent to a segment who unsubscribes or reports the email as
    spam unsubscribes from all lists. The `contact.unsubscribed` or
    `contact.complained` event has `list` and `list_contact` set to `null`,
    and carries the `campaign_id` and the `segment_id`.

    **What sends no contact event**:
    - A change of a membership's status to `unconfirmed`
    - Importing contacts from a CSV file
    - Saving a contact search as a list
    - Removing a contact field from all contacts
    - Email validation results (`validation_status` and `last_validated_at`). A validation that blocks a contact changes its `status`, and that sends `contact.updated`.
    - The memberships that are deleted with their contact: `contact.deleted` says that the contact and all its memberships are gone
    - Deleting a list: the list's memberships are kept

    ### Origin

    Contact and suppression events carry `origin`, which says who made the change:

    - `recipient`: the contact or recipient, through an unsubscribe link, a one-click unsubscribe, or a spam complaint
    - `api`: you, through the AhaSend API
    - `dashboard`: you, through the AhaSend dashboard
    - `system`: AhaSend, for example after a bounce, an expired message or an email validation, or when AhaSend support makes the change

    Message events and `domain.dns_error` have no `origin`: a recipient, a mail
    server, or a DNS check always causes them.

    **Origin filter**: Each webhook has an `origins` setting, the list of
    origins whose contact and suppression events it gets. The default is
    `null`, which means every origin. A list that holds all four origins is
    saved as `null`, so that an origin added later reaches the webhook too. An
    empty list is refused: to stop contact or suppression events, turn them
    off. Events without an `origin` (message events and `domain.dns_error`)
    always pass the filter. In the dashboard, the setting is "Send changes
    made by".

    **Prevent loops**: A handler that writes to the AhaSend API every time it
    receives `contact.updated` receives its own write as a new
    `contact.updated` event, with `origin: api`. Make sure that the handler
    does not write again when the contact already has the values it wants, or
    set the webhook's `origins` to leave out `api`, so that it does not get the
    changes made through the API.

    ## Getting Started

    1. **Configure a webhook** in your AhaSend dashboard
    2. **Choose which events** you want to receive
    3. **Verify webhook signatures** using the literal resource secret as described above
    4. **Handle the events** in your application

    For more information, visit the [AhaSend webhook documentation](https://ahasend.com/help/integrations/webhooks).

  version: "2.0.0"
  contact:
    email: support@ahasend.com
  license:
    name: Proprietary

servers:
  - url: https://your-webhook-endpoint.com
    description: Your webhook endpoint URL (configured in AhaSend dashboard)

webhooks:
  # Message Event Webhooks
  message.reception:
    post:
      summary: Message Reception Event
      description: |
        &nbsp;

        Triggered when an email has been received and queued.
        This is always the first event in a message's lifecycle. The message has been accepted by AhaSend and is queued for delivery to the recipient's mail server.

        **When it's sent**: Immediately after AhaSend receives and queues an email for delivery.
        <Note>
          This webhook is called for both inbound and outbound emails.
        </Note>
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReceptionWebhookPayload'
            example:
              type: "message.reception"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T09:49:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_reception"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.delivered:
    post:
      summary: Message Delivered Event
      description: |
        &nbsp;

        Triggered when an email has been successfully delivered to the recipient's mail server.

        This indicates that the recipient's mail server has accepted the email. Note that this doesn't guarantee the email reached the recipient's inbox (it could still be filtered to spam).

        **When it's sent**: When the recipient's mail server confirms successful delivery.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDeliveredWebhookPayload'
            example:
              type: "message.delivered"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T09:50:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_delivered"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                delivery_attempt:
                  smtp_code: 250
                  enhanced_status_code: "2.0.0"
                  response: "OK: queued"
                  command: "DATA"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.transient_error:
    post:
      summary: Message Transient Error Event
      description: |
        &nbsp;

        Triggered when an email delivery is delayed due to a temporary issue with the receiving mail server.

        This is a temporary failure (soft bounce). AhaSend will retry delivery according to its retry policy. Common causes include:
        - Recipient's mailbox is full
        - Temporary server issues
        - Rate limiting by the recipient's server

        **When it's sent**: When a temporary delivery failure occurs.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTransientErrorWebhookPayload'
            example:
              type: "message.transient_error"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T09:51:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_transient_error"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                delivery_attempt:
                  classification: "QuotaIssues"
                  smtp_code: 452
                  enhanced_status_code: "4.2.2"
                  response: "The recipient's inbox is out of storage space"
                  command: "RCPT TO"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.failed:
    post:
      summary: Message Failed Event
      description: |
        &nbsp;

        Triggered when an email exhausts its retry window without being delivered.

        No more delivery attempts will be made. This event reports retry exhaustion rather than one specific SMTP exchange, so `data.delivery_attempt` is omitted. An immediate permanent rejection from a recipient server is reported as `message.bounced` instead.

        **When it's sent**: After all retry attempts have been exhausted.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFailedWebhookPayload'
            example:
              type: "message.failed"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T09:55:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_failed"
                from: "sender@example.com"
                recipient: "invalid@nonexistent-domain.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.bounced:
    post:
      summary: Message Bounced Event
      description: |
        &nbsp;

        Triggered when a message reaches a bounced outcome. This includes an immediate permanent SMTP rejection or an out-of-band delivery status notification received after the message was accepted.

        A direct SMTP rejection normally includes `data.delivery_attempt`. An out-of-band bounce does not describe one SMTP attempt, so the object is omitted in that case.

        **When it's sent**: When a recipient server permanently rejects the message or AhaSend receives a later bounce notification.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageBouncedWebhookPayload'
            example:
              type: "message.bounced"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:05:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_bounced"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                delivery_attempt:
                  classification: "InvalidRecipient"
                  smtp_code: 550
                  enhanced_status_code: "5.1.1"
                  response: "The email account that you tried to reach does not exist"
                  command: "RCPT TO"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.suppressed:
    post:
      summary: Message Suppressed Event
      description: |
        &nbsp;

        Triggered when no delivery attempt was made because the recipient is suppressed.

        The email was not sent because the recipient email address is on your suppression list. This prevents sending to addresses that have previously bounced or been marked as problematic.

        **When it's sent**: When an email is submitted for a suppressed recipient.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSuppressedWebhookPayload'
            example:
              type: "message.suppressed"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:10:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_suppressed"
                from: "sender@example.com"
                recipient: "bounced@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.opened:
    post:
      summary: Message Opened Event
      description: |
        &nbsp;

        Triggered when the recipient opens your email.

        **Requirements**:
        - Open tracking must be enabled for your account or this specific email
        - The email must contain HTML content
        - The recipient's email client must load images

        **Additional Data**: This webhook includes user agent and IP address information for analytics.

        **Bot Detection**: The `is_bot` field indicates whether the open was detected as automated (email security scanners, etc.).

        **When it's sent**: When the tracking pixel in the email is loaded.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageOpenedWebhookPayload'
            example:
              type: "message.opened"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:15:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_opened"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                ip: "192.168.1.100"
                is_bot: false
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.clicked:
    post:
      summary: Message Clicked Event
      description: |
        &nbsp;

        Triggered when the recipient clicks a tracked link in your email.

        **Requirements**:
        - Click tracking must be enabled for your account or this specific email
        - The clicked link must be processed by AhaSend's click tracking system

        **Additional Data**: This webhook includes user agent and IP address information for analytics.

        **When it's sent**: When a tracked link in the email is clicked.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageClickedWebhookPayload'
            example:
              type: "message.clicked"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:20:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_clicked"
                from: "sender@example.com"
                recipient: "recipient@example.com"
                subject: "Welcome to our service"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                url: "https://example.com/landing-page"
                user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                ip: "192.168.1.100"
                is_bot: false
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.unsubscribed:
    post:
      summary: Message Unsubscribed Event
      description: |
        &nbsp;

        Triggered when the recipient unsubscribes through the unsubscribe link of your campaign email, or through the one-click unsubscribe of their email client (RFC 8058). This event is sent for campaign email.

        `data.unsubscribe.method` is `one_click` for a one-click unsubscribe (RFC 8058), and `link` for any other unsubscribe request, for example through the link.

        **Repeats**: This event is sent for every unsubscribe request that AhaSend accepts for the message, also when the recipient is already unsubscribed or suppressed, and again when the recipient uses the same link a second time. AhaSend sends at most one event per message in each 10-minute period, and the contact events of the same requests are not limited this way, so a contact event can arrive without a `message.unsubscribed` of its own. Drop the repeats by `type` and `data.id`. The contact events and the `suppression.created` event of the same request are sent only when the request changes something.

        **When it's sent**: When AhaSend accepts an unsubscribe request for the message.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageUnsubscribedWebhookPayload'
            example:
              type: "message.unsubscribed"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:25:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_unsubscribed"
                from: "Example News <news@example.com>"
                recipient: "recipient@example.com"
                subject: "Our October news"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                is_bot: false
                unsubscribe:
                  method: "one_click"
                campaign_id: "8b0f4c2e-5d1a-4f6b-9c3e-2a7d1e9f0b44"
                list_id: "c3e1a9d2-7f4b-4e8a-b5c6-1d2e3f4a5b6c"
                segment_id: null
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  message.complained:
    post:
      summary: Message Complained Event
      description: |
        &nbsp;

        Triggered when the recipient's mailbox provider reports your campaign email as spam through its feedback loop. This event is sent for campaign email.

        `data.complaint.feedback_type` is the feedback type of the report, `abuse` or `fraud`. `data.complaint.reporter` is the feedback loop that sent the report.

        **Repeats**: This event is sent for every complaint report that AhaSend matches to the message, also when the recipient is already unsubscribed or suppressed. Drop the repeats by `type` and `data.id`. The contact events and the `suppression.created` event of the same report are sent only when the report changes something, with one exception: a complaint about a campaign sent to a segment sends `contact.complained` when AhaSend records the complaint for the campaign's recipient, also when the contact is already unsubscribed.

        **When it's sent**: When AhaSend receives a spam complaint report and matches it to the message.
      tags:
        - Message Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageComplainedWebhookPayload'
            example:
              type: "message.complained"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T10:30:16.687031577Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                event: "on_complained"
                from: "Example News <news@example.com>"
                recipient: "recipient@example.com"
                subject: "Our October news"
                message_id_header: "<message-id-12345@localhost>"
                id: "407926766d2711f09b30960002cafe7c"
                is_bot: false
                complaint:
                  feedback_type: "abuse"
                  reporter: "yahoo"
                campaign_id: "8b0f4c2e-5d1a-4f6b-9c3e-2a7d1e9f0b44"
                list_id: "c3e1a9d2-7f4b-4e8a-b5c6-1d2e3f4a5b6c"
                segment_id: null
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  # Suppression Event Webhooks
  suppression.created:
    post:
      summary: Suppression Created Event
      description: |
        &nbsp;

        Triggered when a suppression is created for an email address, or when an existing suppression gets a new reason.

        **Why suppressions are created**:
        - Multiple hard bounces from the same email address (`origin: system`)
        - Repeated soft bounces over time (`origin: system`)
        - The recipient reports a transactional email as spam (reason `FBL Complaint Report`, `origin: recipient`)
        - The recipient unsubscribes through the unsubscribe link of a transactional email (reason `Unsubscribed`, `origin: recipient`)
        - You create a suppression through the API (`origin: api`). A request without a domain creates a suppression on each domain of your account, and sends one event for each.

        **Expiration**: A suppression after delivery errors expires after at most 30 days, depending on the error, to allow for temporary issues to be resolved. A suppression after an unsubscribe or a spam complaint lasts 10 years.

        **Impact**: Future emails to this address will be automatically suppressed until the suppression expires or is manually removed.

        `data` is the suppression as it was right after the change, and `timestamp` is the time of the change. For a suppression that got a new reason, `data.created_at` stays the time the suppression was first created, so store suppressions by `data.recipient` and `data.sending_domain`.

        **No event**: The removal of expired suppressions. `data.expires_at` already says when the suppression ends.

        **When it's sent**: When a new suppression is added to your account, or when an existing suppression gets a new reason, for example when a recipient unsubscribes after a bounce. A repeat of an existing suppression, such as a second bounce or a second click on the same unsubscribe link, sends no event, even when it moves the expiry later.
      tags:
        - Suppression Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionWebhookPayload'
            example:
              type: "suppression.created"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T12:57:06.451529527Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                origin: "system"
                recipient: "bounced@example.com"
                created_at: "2024-05-06T12:57:06.451529617Z"
                expires_at: "2024-06-05T12:57:06.451529617Z"
                reason: "Too many hard bounces"
                sending_domain: "your-domain.com"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  suppression.deleted:
    post:
      summary: Suppression Deleted Event
      description: |
        &nbsp;

        Triggered when a suppression is deleted. Future emails to the address are attempted again.

        **Why suppressions are deleted**:
        - You delete a suppression through the API (`origin: api`). A request without a domain deletes the suppressions of the address on every domain of your account, and sends one event for each.
        - You delete a suppression in the dashboard (`origin: dashboard`)
        - AhaSend support deletes a suppression (`origin: system`)

        `data` is the suppression as it was right before the delete, and `timestamp` is the time of the delete.

        **No event**:
        - Wiping the suppressions of your account or of a domain (`DELETE /suppressions/all`). After a wipe, read the list again with `GET /suppressions`.
        - The removal of expired suppressions. `data.expires_at` of `suppression.created` already says when the suppression ends.

        **When it's sent**: When a suppression is deleted.
      tags:
        - Suppression Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionWebhookPayload'
            example:
              type: "suppression.deleted"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2026-10-21T10:15:00Z"
              data:
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                origin: "api"
                recipient: "user@example.org"
                created_at: "2026-10-01T08:00:00Z"
                expires_at: "2026-10-31T08:00:00Z"
                reason: "Too many hard bounces"
                sending_domain: "example.com"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

  # Domain Event Webhooks
  domain.dns_error:
    post:
      summary: Domain DNS Error Event
      description: |
        &nbsp;

        AhaSend automatically checks your domain's DNS configuration every 15 to 30 minutes and sends this webhook if any severer issues are detected that will prevent the system from sending emails on your domain's behalf.

        Triggered when DNS configuration issues are detected for any domain in your account.

        **Common DNS issues**:
        - Missing or invalid SPF record
        - Missing or invalid DKIM record
        - Missing or invalid DMARC record
        - DNS propagation delays

        **Impact**: After this event, email sending will be rejected until DNS configuration is fixed.

        **Resolution**: Check your domain's DNS settings in the AhaSend dashboard and update your DNS records as needed.

        **When it's sent**: When AhaSend's automated DNS checker detects configuration problems.
      tags:
        - Domain Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainWebhookPayload'
            example:
              type: "domain.dns_error"
              webhook_id: "abe11757-2886-4b55-96f1-0e0afc95795a"
              timestamp: "2024-05-06T12:59:46.404433272Z"
              data:
                domain: "example.com"
                account_id: "4cdd7bdd-294e-4762-892f-83d40abf5a87"
                spf_valid: false
                dkim_valid: false
                dmarc_valid: false
                dns_last_checked_at: "2024-05-06T12:59:46.404433312Z"
      responses:
        '200':
          description: Webhook received successfully
        '201':
          description: Webhook received successfully
        '202':
          description: Webhook received successfully
        '204':
          description: Webhook received successfully

