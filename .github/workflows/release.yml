name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the one job that writes declares what it needs.
permissions:
  contents: read

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

jobs:
  # Validate the release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate tag format
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      # The SDK advertises its version in the User-Agent from a constant: a Go
      # library is compiled from source by its consumers, so a release cannot
      # stamp it in at build time. Refuse a tag that disagrees with it.
      - name: Verify the version constant matches the tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CONSTANT="v$(go run ./internal/cmd/sdkversion)"
          if [ "$CONSTANT" != "$TAG" ]; then
            echo "Tag $TAG does not match api.Version ($CONSTANT)."
            echo "Update the Version constant in api/version.go and re-tag."
            exit 1
          fi

      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not an ancestor of origin/main."
            exit 1
          fi

      - name: Run unit tests
        run: go test -short -race ./...
        env:
          SKIP_INTEGRATION_TESTS: true

      - name: Build SDK
        run: go build -v ./...

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUMBER=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}

  # Run the full test suite, including the specification-driven tests
  test-release:
    name: Release Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Prism CLI
        run: npm install -g @stoplight/prism-cli@5

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          SKIP_INTEGRATION_TESTS: true

      # The mock-backed tests start Prism themselves. AHASEND_REQUIRE_PRISM
      # turns a mock that fails to start into a release failure rather than a
      # skip, so this gate cannot pass by running nothing.
      - name: Run integration tests against the mocked specification
        run: go test -v -timeout=15m ./api/ ./test/
        env:
          SKIP_INTEGRATION_TESTS: false
          AHASEND_REQUIRE_PRISM: true

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: release
          name: release-coverage

  # Create GitHub release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, test-release]
    # Publishing the GitHub release is the only write this workflow performs.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write the installation and documentation notes
        run: |
          CURRENT_TAG=${{ needs.validate.outputs.version }}
          cat > RELEASE_NOTES.md <<NOTES
          ## Installation

          \`\`\`bash
          go get github.com/AhaSend/ahasend-go@$CURRENT_TAG
          \`\`\`

          ## Documentation

          - [API Documentation](https://ahasend.com/docs)
          - [SDK Documentation](./README.md)
          - [Environment Variables](./ENV.md)
          - [Idempotency Guide](./IDEMPOTENCY.md)
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.validate.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AhaSend Go SDK ${{ needs.validate.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes

  # Post-release tasks
  post-release:
    name: Post Release
    runs-on: ubuntu-latest
    needs: [validate, release]

    steps:
      - name: Prime the Go module proxy
        run: |
          # The proxy indexes a version on first request, so asking for it here
          # means the first real consumer does not pay for that.
          VERSION=${{ needs.validate.outputs.version }}
          curl -f "https://proxy.golang.org/github.com/!aha!send/ahasend-go/@v/$VERSION.info" \
            || echo "Module indexing will happen on first use"

      - name: Notify team
        run: |
          echo "🚀 AhaSend Go SDK ${{ needs.validate.outputs.version }} has been released!"
          echo "📦 Available at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}"
          echo "📚 Install with: go get github.com/AhaSend/ahasend-go@${{ needs.validate.outputs.version }}"
